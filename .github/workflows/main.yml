name: Build Android APK & Google Play AAB

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Unpack & Prepare
        run: |
          for f in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Found zip archive: $f, extracting..."
            unzip -o "$f"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Clean Rebuild Android Native & Build APK + AAB
        run: |
          echo "=== 1. 定位專案目錄 ==="
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$FLUTTER_DIR" ]; then
            echo "❌ 找不到專案設定檔"
            exit 1
          fi
          echo "✅ 專案路徑: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"

          echo "=== 2. 重置標準 Android 原生架構 (徹底解決 Gradle/Kotlin 衝突) ==="
          rm -rf android
          flutter create . --platforms=android --org=vn.vieclambando

          echo "=== 3. 注入定位與網路權限 ==="
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"\/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml

          echo "=== 4. 下載相依套件 ==="
          flutter pub get

          echo "=== 5. 生成 Android 實機安裝檔 (.apk) ==="
          flutter build apk --release --no-tree-shake-icons

          echo "=== 6. 生成 Google Play 上架安裝檔 (.aab) ==="
          flutter build appbundle --release --no-tree-shake-icons

      - name: Upload APK Artifact (直接安裝至手機)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-install-now
          path: "**/build/app/outputs/flutter-apk/app-release.apk"

      - name: Upload AAB Artifact (Google Play 上架專用)
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-release-aab
          path: "**/build/app/outputs/bundle/release/app-release.aab"
