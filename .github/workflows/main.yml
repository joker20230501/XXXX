name: Build Google Play AAB Bundle

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Unpack & Locate Project
        run: |
          echo "=== 1. 檢查檔案 ==="
          ls -la
          # 若有上傳 zip 壓縮檔，自動在雲端解壓縮
          for f in $(find . -maxdepth 2 -name "*.zip"); do
            echo "發現壓縮檔: $f，自動解壓中..."
            unzip -o "$f"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Auto Find Flutter Project & Build AAB
        run: |
          echo "=== 自動定位 Flutter 專案 ==="
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$FLUTTER_DIR" ]; then
            echo "❌ 找不到專案設定檔，請確認有上傳專案檔案或 zip"
            exit 1
          fi
          echo "✅ 成功找到專案路徑: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"
          flutter pub get
          flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-release-aab
          path: "**/build/app/outputs/bundle/release/app-release.aab"
