name: Build Google Play AAB Bundle

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-Unpack & Prepare
        run: |
          for f in $(find . -maxdepth 2 -name "*.zip"); do
            echo "Found zip archive: $f, extracting..."
            unzip -o "$f"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Auto Repair Android Embedding & Build AAB
        run: |
          echo "=== 1. 定位專案目錄 ==="
          FLUTTER_DIR=$(find . -name "pubspec.yaml" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -z "$FLUTTER_DIR" ]; then
            echo "❌ 找不到專案設定檔"
            exit 1
          fi
          echo "✅ 專案路徑: $FLUTTER_DIR"
          cd "$FLUTTER_DIR"

          echo "=== 2. 自動修復並補齊 Android v2 Embedding ==="
          flutter create . --platforms=android --org=vn.vieclambando

          echo "=== 3. 下載相依套件 ==="
          flutter pub get

          echo "=== 4. 生成 Google Play AAB 安裝包 ==="
          flutter build appbundle --release --no-tree-shake-icons

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: google-play-app-release-aab
          path: "**/build/app/outputs/bundle/release/app-release.aab"
