version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: vn_job_postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: vn_job_match
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vn_job_backend
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/vn_job_match?schema=public"
      PORT: 3000
      JWT_SECRET: "vn_super_secret_jwt_key_2026"
      NODE_ENV: "production"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: always

volumes:
  pgdata:
